<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吧唧特 · 月度预算 + 历史看板</title>
<style>
/* ============================================
   主题色变量（改这里调整配色）
   ============================================ */
:root {
  /* 奶油纸感底色 + 黑字 + 红/黄/蓝紫对比（参考 pixel.coin 风格） */
  --bg: #FAF7F2;
  --bg-card: #FCFCFC;
  --bg-secondary: #F1EDE5;
  --bg-tertiary: #E5E0D5;
  --text-primary: #0F0E0B;
  --text-secondary: #3A3832;
  --text-tertiary: #6E6A5E;
  --border: rgba(15, 14, 11, 0.18);
  --border-strong: rgba(15, 14, 11, 0.35);
  --border-bold: #0F0E0B;

  /* 品牌色 */
  --navy: #2D2F8C;     /* 电光蓝紫 */
  --teal: #1F5050;
  --sage: #6E8A66;
  --rose: #E5523A;     /* 番茄红 */
  --amber: #F2B82A;    /* 蛋黄黄 */
  --coral: #E5523A;
  --black: #0F0E0B;

  /* 语义色 */
  --success: #2D6B14;
  --success-bg: #D9E8BD;
  --danger: #B92516;
  --danger-bg: #F4D2C9;
  --warning: #8B5A12;
  --warning-bg: #F0DBA0;

  /* 圆角 */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15130E;
    --bg-card: #1F1C16;
    --bg-secondary: #28241C;
    --bg-tertiary: #332E22;
    --text-primary: #F2EBD2;
    --text-secondary: #BFB89E;
    --text-tertiary: #8A836D;
    --border: rgba(242, 235, 210, 0.18);
    --border-strong: rgba(242, 235, 210, 0.35);
    --border-bold: #F2EBD2;
    --success-bg: #2A4D14;
    --danger-bg: #5A2117;
    --warning-bg: #4A3008;
  }
}

/* ============================================
   基础重置
   ============================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ============================================
   布局
   ============================================ */
.app {
  max-width: 780px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: #FFFFFF;
  border: 1px solid var(--text-primary);
  border-radius: 10px;
  flex: none;
  overflow: hidden;
}

.brand-logo svg,
.brand-logo img {
  display: block;
  width: 30px;
  height: 30px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.app-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  line-height: 1.2;
}

.app-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
}

/* 可编辑账本名 */
.book-name {
  background: transparent;
  border: 1px dashed transparent;
  border-radius: 6px;
  padding: 2px 6px;
  margin-top: 1px;
  margin-left: -6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  font-family: inherit;
  cursor: text;
  width: 240px;
  max-width: 100%;
  transition: border-color 0.15s, background 0.15s;
}
.book-name:hover { border-color: var(--border-strong); }
.book-name:focus {
  border-color: var(--text-primary);
  border-style: solid;
  outline: none;
  background: var(--bg-card);
  color: var(--text-primary);
}
.book-name::placeholder { color: var(--text-tertiary); font-weight: 400; }

/* ============================================
   月份导航
   ============================================ */
.nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  position: sticky;
  top: 50px;
  z-index: 19;
  background: var(--bg);
  padding: 6px 0;
}

.nav button {
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 14px;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--text-primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}

.nav button:hover { background: var(--text-primary); color: var(--bg-card); }
.nav button:active { transform: scale(0.96); }

.nav select {
  height: 34px;
  min-width: 140px;
  padding: 0 10px;
  font-size: 14px;
  font-weight: 500;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-md);
  font-family: inherit;
  cursor: pointer;
}

.save-status {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.save-status.dirty { color: var(--warning); }

/* 图标按钮（保存 / 清空 等并排放在 nav 里） */
.icon-btn {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--text-primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--text-primary); color: var(--bg-card); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn.primary {
  background: var(--text-primary);
  color: var(--bg-card);
}
.icon-btn.primary:hover { background: #2A2A28; }
.icon-btn svg { display: block; width: 16px; height: 16px; flex: none; }

/* ============================================
   提示条
   ============================================ */
.toast {
  display: none;
  font-size: 13px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--success-bg);
  color: var(--success);
  margin-bottom: 16px;
}

.toast.show {
  display: block;
  animation: fadeIn 0.2s;
}

.toast.error {
  background: var(--danger-bg);
  color: var(--danger);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

/* ============================================
   摘要卡片
   ============================================ */
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.metric {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}

.metric-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 0 0 4px;
}

.metric-value {
  font-size: 22px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.metric-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}

/* ============================================
   分类区块
   ============================================ */
.section {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 12px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 12px;
  margin-bottom: 6px;
  border-bottom: 0.5px solid var(--border);
}

.section-title {
  font-size: 15px;
  font-weight: 500;
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.section-title svg,
.card-title svg {
  width: 16px;
  height: 16px;
  flex: none;
  color: var(--text-secondary);
}

.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ============================================
   项目行
   ============================================ */
.item-row {
  display: grid;
  grid-template-columns: 1fr 90px 120px 76px;
  gap: 12px;
  align-items: center;
  padding: 9px 0;
}

.item-row + .item-row {
  border-top: 0.5px solid var(--border);
}

.item-name {
  font-size: 13px;
  color: var(--text-primary);
}

.cur-pill {
  display: inline-block;
  font-size: 10px;
  color: var(--text-tertiary);
  background: var(--bg-tertiary);
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 500;
}

.item-budget {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.item-input {
  height: 32px;
  padding: 0 10px;
  font-size: 13px;
  text-align: right;
  background: var(--bg);
  color: var(--text-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  transition: border-color 0.15s;
}

.item-input:hover { border-color: var(--border-strong); }
.item-input:focus {
  outline: none;
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px rgba(15, 14, 11, 0.08);
}

.item-input::-webkit-inner-spin-button,
.item-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.item-input[type="number"] { -moz-appearance: textfield; }

.item-variance {
  font-size: 11px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}

.v-ok { color: var(--success); }
.v-over { color: var(--danger); }

.section-footer {
  display: flex;
  justify-content: space-between;
  padding-top: 12px;
  margin-top: 6px;
  border-top: 0.5px solid var(--border-strong);
  font-size: 13px;
  font-weight: 500;
}

.section-footer span:last-child {
  font-variant-numeric: tabular-nums;
}

.section-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

.section-actions button {
  height: 28px;
  padding: 0 10px;
  font-size: 12px;
  background: transparent;
  color: var(--text-secondary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
}

.section-actions button:hover {
  background: var(--bg-secondary);
  color: var(--text-primary);
}

/* ============================================
   备注 & 操作按钮
   ============================================ */
.notes-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 16px;
}

.notes-label {
  font-size: 13px;
  font-weight: 500;
  margin: 0 0 10px;
}

.notes-textarea {
  width: 100%;
  min-height: 70px;
  padding: 10px 12px;
  font-size: 13px;
  font-family: inherit;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text-primary);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  resize: vertical;
}

.notes-textarea:focus {
  outline: none;
  border-color: var(--text-primary);
}

.actions {
  display: flex;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.actions button {
  height: 38px;
  padding: 0 16px;
  font-size: 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.actions .primary {
  background: var(--text-primary);
  color: var(--bg-card);
  border: 1px solid var(--text-primary);
  font-weight: 500;
}

.actions .primary:hover { background: #2A2A28; border-color: #2A2A28; }
.actions .primary:active { transform: scale(0.98); }

.actions .secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--text-primary);
}

.actions .secondary:hover { background: var(--bg-secondary); }

/* ============================================
   历史记录
   ============================================ */
.history {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: 18px 22px;
}

.history-title {
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.history-title-actions {
  display: flex;
  gap: 8px;
}

.history-title-actions button {
  height: 26px;
  padding: 0 10px;
  font-size: 11px;
  background: transparent;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-family: inherit;
}

.history-title-actions button:hover {
  background: var(--bg-card);
  color: var(--text-primary);
}

.history-row {
  display: grid;
  grid-template-columns: 90px 1fr 90px 80px 60px;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.history-row + .history-row {
  border-top: 0.5px solid var(--border);
}

.history-load {
  height: 26px;
  padding: 0 10px;
  font-size: 11px;
  background: transparent;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-family: inherit;
}

.history-load:hover {
  background: var(--text-primary);
  color: var(--bg-card);
  border-color: var(--text-primary);
}

.empty {
  font-size: 13px;
  color: var(--text-tertiary);
  text-align: center;
  padding: 20px 0;
}

/* ============================================
   头部右侧链接（保留兼容）
   ============================================ */
.dash-link {
  font-size: 12px;
  background: var(--text-primary);
  color: var(--bg-card);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 500;
  border: 1px solid var(--border-bold);
  transition: opacity 0.15s;
}
.dash-link:hover { opacity: 0.85; }

/* ============================================
   顶部 Tab 切换
   ============================================ */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--text-primary);
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding-top: 8px;
}
.tab-btn {
  padding: 12px 20px;
  font-size: 14px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
}

.view { display: none; }
.view.active { display: block; }

/* ============================================
   历史看板（dashboard view）
   ============================================ */
.dash-range {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  text-align: right;
}

.summary-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
@media (max-width: 720px) { .summary-4 { grid-template-columns: repeat(2, 1fr); } }

.card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.card-title { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
.card-sub { font-size: 12px; color: var(--text-tertiary); margin: 0 0 16px; }

.bars-wrap { width: 100%; overflow-x: auto; }
.bars-svg {
  display: block;
  width: 100%;
  min-width: 640px;
  height: 260px;
}
.bar-expense { fill: var(--coral); }
.bar-income { fill: var(--sage); }
.bar-axis { stroke: var(--border); stroke-width: 0.5; }
.bar-label { fill: var(--text-tertiary); font-size: 10px; font-family: inherit; }
.bar-value { fill: var(--text-secondary); font-size: 10px; font-family: inherit; font-variant-numeric: tabular-nums; }
.bar-month { fill: var(--text-secondary); font-size: 11px; font-family: inherit; }
.bar-grid { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 2 3; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.dot-expense { background: var(--coral); }
.dot-income { background: var(--sage); }

.cat-list { display: flex; flex-direction: column; gap: 6px; }
.cat-row {
  display: grid;
  grid-template-columns: 90px 1fr 200px 70px;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.cat-row .cat-name { color: var(--text-primary); }
.cat-bar-track {
  height: 14px;
  background: var(--bg-secondary);
  border-radius: 4px;
  overflow: hidden;
}
.cat-bar-fill { height: 100%; background: var(--text-primary); border-radius: 4px; }
.cat-bar-fill.f-1 { background: var(--text-primary); }
.cat-bar-fill.f-2 { background: var(--text-secondary); }
.cat-bar-fill.f-3 { background: var(--text-tertiary); }
.cat-bar-fill.f-4 { background: var(--bg-tertiary); }
.cat-bar-fill.f-5 { background: var(--bg-tertiary); }
.cat-bar-fill.f-6 { background: var(--bg-tertiary); }
.cat-row .cat-amt { text-align: right; color: var(--text-secondary); }
.cat-row .cat-pct { text-align: right; color: var(--text-tertiary); font-size: 11px; }

.heat-wrap { width: 100%; overflow-x: auto; }
.heat-table {
  border-collapse: collapse;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  min-width: 720px;
}
.heat-table th, .heat-table td {
  padding: 6px 8px;
  text-align: right;
  border-bottom: 0.5px solid var(--border);
}
.heat-table th {
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-card);
}
.heat-table th:first-child, .heat-table td:first-child {
  text-align: left;
  background: var(--bg-card);
  font-weight: 500;
  color: var(--text-primary);
  border-right: 0.5px solid var(--border);
  min-width: 80px;
}
.heat-cell { color: var(--text-primary); }
.heat-cell-empty { color: var(--text-tertiary); }
/* 奶黄/奶油色渐变（低饱和度） */
.heat-cell.h-1 { background: #FAF1DC; }
.heat-cell.h-2 { background: #F2E1B0; }
.heat-cell.h-3 { background: #E8CC82; }
.heat-cell.h-4 { background: #D8B459; }
.heat-cell.h-5 { background: #BC9234; color: #FCFCFC; }

@media (prefers-color-scheme: dark) {
  .heat-cell.h-1 { background: #3A3220; color: #F2EBD2; }
  .heat-cell.h-2 { background: #524627; color: #F2EBD2; }
  .heat-cell.h-3 { background: #6E5C2C; color: #F2EBD2; }
  .heat-cell.h-4 { background: #927731; color: #FCFCFC; }
  .heat-cell.h-5 { background: #B6953A; color: #FCFCFC; }
}

/* 热力 tooltip */
.heat-tooltip {
  position: fixed;
  background: var(--text-primary);
  color: var(--bg-card);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  line-height: 1.45;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) translateY(-6px);
  transition: opacity 0.1s;
  z-index: 100;
  font-variant-numeric: tabular-nums;
}
.heat-tooltip.show { opacity: 1; }
.heat-tooltip strong { font-weight: 600; }
.heat-tooltip .t-amt { color: var(--bg-secondary); }
.heat-row-total td { font-weight: 500; border-top: 1px solid var(--text-primary); background: var(--bg-secondary); }

.profile-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 18px;
}
@media (max-width: 720px) { .profile-grid { grid-template-columns: 1fr; } }
.profile-row {
  display: grid;
  grid-template-columns: 80px 1fr 70px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  border-bottom: 0.5px solid var(--border);
}
.profile-row:last-child { border-bottom: 0; }
.profile-name { color: var(--text-primary); }
.profile-spark { height: 22px; display: block; }
.profile-spark path { fill: none; stroke: var(--text-primary); stroke-width: 1.4; }
.profile-spark .area { fill: rgba(15, 14, 11, 0.08); stroke: none; }
.profile-avg { text-align: right; color: var(--text-secondary); }

.big-list { display: flex; flex-direction: column; }
.big-row {
  display: grid;
  grid-template-columns: 90px 60px 1fr 90px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  border-bottom: 0.5px solid var(--border);
}
.big-row:last-child { border-bottom: 0; }
.big-date { color: var(--text-tertiary); }
.big-cat {
  display: inline-block;
  padding: 1px 8px;
  font-size: 11px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  color: var(--text-secondary);
  text-align: center;
  width: max-content;
}
.big-note { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.big-amt { text-align: right; font-weight: 500; color: var(--text-primary); }

.dash-filter { margin-top: 14px; }
.dash-filter select {
  height: 28px;
  padding: 0 8px;
  font-size: 12px;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--text-primary);
  border-radius: var(--radius-sm);
  font-family: inherit;
}

.muted { color: var(--text-tertiary); font-size: 12px; }
.metric-pos { color: var(--success); }
.metric-neg { color: var(--danger); }

/* ============================================
   月份切换 Tab（看板内）
   ============================================ */
.month-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 2px 14px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}
.month-tabs::-webkit-scrollbar { height: 4px; }
.month-tabs::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 2px; }

.month-tab {
  flex: none;
  padding: 6px 12px;
  font-size: 13px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.month-tab:hover { background: var(--bg-tertiary); }
.month-tab.active {
  background: var(--text-primary);
  color: var(--bg-card);
}

/* ============================================
   彩色标签（参考 ChartMogul 风格）
   ============================================ */
.tag {
  display: inline-block;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 999px;
  white-space: nowrap;
}
.tag-mint   { background: #D9EFE5; color: #1F6849; }
.tag-pink   { background: #F7DDE3; color: #A53752; }
.tag-blue   { background: #D7EAF6; color: #2C5F87; }
.tag-purple { background: #E5DBF0; color: #553B8C; }
.tag-rose   { background: #F8DCEC; color: #A2407D; }
.tag-yellow { background: #F5E9C2; color: #7E5A0F; }
.tag-orange { background: #F8DEC8; color: #8A4715; }
.tag-gray   { background: #E8E6E0; color: #4A4843; }

@media (prefers-color-scheme: dark) {
  .tag-mint   { background: #1F4E3D; color: #BFE8D5; }
  .tag-pink   { background: #4F2030; color: #F2C5D1; }
  .tag-blue   { background: #1E3A55; color: #C5E0F0; }
  .tag-purple { background: #3A2A55; color: #D5C5E5; }
  .tag-rose   { background: #4F2245; color: #F0C5DD; }
  .tag-yellow { background: #4D3A0F; color: #F0E0A0; }
  .tag-orange { background: #4F2A14; color: #F2D0AC; }
  .tag-gray   { background: #38362F; color: #B8B5A8; }
}

/* ============================================
   吃豆人进度条
   ============================================ */
.pacman-card {
  background: var(--bg-card);
  border: 1px solid var(--border-bold);
  border-radius: var(--radius-lg);
  padding: 16px 20px 14px;
  margin-bottom: 18px;
}

.pacman-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  gap: 12px;
}

.pacman-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}

.pacman-status {
  font-size: 12px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.pacman-status .pacman-pct { color: var(--rose); font-weight: 600; margin-left: 6px; }
.pacman-status .pacman-pct.over { color: var(--danger); }

.pacman-svg {
  display: block;
  width: 100%;
  height: 56px;
}

.pacman-svg .track {
  fill: var(--bg-secondary);
}
.pacman-svg .pixel-pac rect { shape-rendering: crispEdges; }
.pacman-svg .pixel-apple rect { shape-rendering: crispEdges; }

.pacman-foot {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-tertiary);
}

/* ============================================
   响应式
   ============================================ */
@media (max-width: 600px) {
  .summary { grid-template-columns: 1fr; }

  .item-row {
    grid-template-columns: 1fr 70px 90px 60px;
    gap: 8px;
  }

  .item-name { font-size: 12px; }

  .history-row {
    grid-template-columns: 80px 1fr 60px 50px;
    font-size: 11px;
  }

  .history-row span:nth-child(4) { display: none; }
}

</style>
</head>

(function () {
  const tabs = document.querySelectorAll('.tab-btn');
  const views = document.querySelectorAll('.view');
  function switchTo(name) {
    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    views.forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    history.replaceState(null, '', '#' + name);
    if (name === 'dashboard' && window.__redrawDashboard) window.__redrawDashboard();
  }
  tabs.forEach(b => b.addEventListener('click', () => switchTo(b.dataset.tab)));
  const initial = (location.hash || '').slice(1);
  if (initial === 'dashboard') switchTo('dashboard');
})();

<script>
// 预算配置
// 修改这个文件来调整预算数字、分类、汇率等

const CONFIG = {
  // 汇率：1 HKD = 多少 CNY
  // 建议每季度更新一次
  exchangeRate: 0.87,

  // 月收入（港币）
  incomeHKD: 30000,

const SECTIONS = [
  {
    id: 'fixed',
    title: '固定开销',
    subtitle: '刚性支出，基本不变',
    items: [
      { id: 'rent', name: '房租 + 杂费', budget: 5554, cur: 'CNY' },

      { id: 'phone', name: '电话费', budget: 100, cur: 'CNY' }
    ]
  },
  {
    id: 'living',
    title: '日常生活',
    subtitle: '激进压缩版',
    items: [
      { id: 'food', name: '餐饮', budget: 2200, cur: 'CNY' },
      { id: 'ent', name: '娱乐 / 社交', budget: 500, cur: 'CNY' },
      { id: 'flex', name: '弹性缓冲', budget: 500, cur: 'CNY' },
      { id: 'daily', name: '日用品', budget: 500, cur: 'CNY' },
      { id: 'care', name: '个人护理', budget: 400, cur: 'CNY' },
      { id: 'cloth', name: '服饰（月摊）', budget: 400, cur: 'CNY' },
      { id: 'health', name: '健康 / 运动', budget: 500, cur: 'CNY' }
    ]
  },
  {
    id: 'savings',
    title: '储蓄 + 投资',
    subtitle: '多币种池子',
    items: [
      { id: 'rmb_em', name: 'RMB 应急金', budget: 2500, cur: 'CNY' },
      { id: 'invest', name: '基金定投', budget: 2000, cur: 'HKD' },
      { id: 'hkd_em', name: '港币应急金', budget: 2875, cur: 'HKD' },
      { id: 'wedding', name: '婚礼基金', budget: 4800, cur: 'HKD' },
      { id: 'buffer', name: '港币活期缓冲', budget: 25, cur: 'HKD' }
    ]
  }
];


// 月度预算记账工具 - 主逻辑
const STORAGE_PREFIX = 'budget_tracker:';
const INCOME_CNY = CONFIG.incomeHKD * CONFIG.exchangeRate;

let currentMonth = '';
let monthData = { actuals: {}, notes: '', saved_at: null };
let dirty = false;

// ============================================
// 工具函数
// ============================================

function buildMonthOptions() {
  const months = [];
  const { start, end } = CONFIG.monthRange;
  for (let y = start.year; y <= end.year; y++) {
    const startM = y === start.year ? start.month : 1;
    const endM = y === end.year ? end.month : 12;
    for (let m = startM; m <= endM; m++) {
      months.push(`${y}-${String(m).padStart(2, '0')}`);
    }
  }
  return months;
}

function fmtCNY(n) { return '¥' + Math.round(n).toLocaleString('en-US'); }
function fmtHKD(n) { return 'HK$' + Math.round(n).toLocaleString('en-US'); }
function fmtByCur(n, cur) { return cur === 'CNY' ? fmtCNY(n) : fmtHKD(n); }
function toCNY(n, cur) { return cur === 'CNY' ? n : n * CONFIG.exchangeRate; }

// ============================================
// 存储
// ============================================

function storageGet(key) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

function storageSet(key, val) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val));
    return true;
  } catch (e) { return false; }
}

function getMonthsTracked() {
  return storageGet('months_tracked') || [];
}

function addMonthTracked(month) {
  const list = getMonthsTracked();
  if (!list.includes(month)) {
    list.push(month);
    list.sort();
    storageSet('months_tracked', list);
  }
}

// ============================================
// 渲染
// ============================================

// Remix Icon SVG（fill=currentColor 跟随文字色）
const SECTION_ICONS = {
  fixed:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.49a1 1 0 0 1 .386-.79l8-6.222a1 1 0 0 1 1.228 0l8 6.222a1 1 0 0 1 .386.79V20zm-2-1V9.978l-7-5.444-7 5.444V19h14z"/></svg>',
  living:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 16V4H2V2h3a1 1 0 0 1 1 1v12h12.438l2-8H8V5h13.72a1 1 0 0 1 .97 1.243l-2.5 10A1 1 0 0 1 19.22 17H5a1 1 0 0 1-1-1zm2 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm12 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>',
  savings: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a11 11 0 1 1 0 22 11 11 0 0 1 0-22zm0 2a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-1 4h2v1h2v2h-4a.5.5 0 0 0 0 1h2a2.5 2.5 0 0 1 0 5h-1v1H10v-1H8v-2h4a.5.5 0 0 0 0-1h-2a2.5 2.5 0 0 1 0-5h1V7z"/></svg>',
};

function renderSections() {
  const wrap = document.getElementById('sectionsWrap');
  let html = '';
  SECTIONS.forEach(sec => {
    let budgetCNY = 0;
    sec.items.forEach(i => { budgetCNY += toCNY(i.budget, i.cur); });
    const icon = SECTION_ICONS[sec.id] || '';
    html += `<div class="section" data-section="${sec.id}">
      <div class="section-header">
        <span class="section-title">${icon}${sec.title}</span>
        <span class="section-sub">${sec.subtitle} · 预算 ${fmtCNY(budgetCNY)}</span>
      </div>`;
    sec.items.forEach(item => {
      const curLabel = item.cur === 'CNY' ? 'RMB' : 'HKD';
      html += `<div class="item-row">
        <span class="item-name">${item.name}<span class="cur-pill">${curLabel}</span></span>
        <span class="item-budget">${fmtByCur(item.budget, item.cur)}</span>
        <input class="item-input" type="number" min="0" step="1" placeholder="${item.budget}" data-item="${item.id}" data-cur="${item.cur}" data-budget="${item.budget}" />
        <span class="item-variance" data-var="${item.id}">—</span>
      </div>`;
    });
    html += `<div class="section-footer">
        <span>小计（RMB 等值）</span>
        <span data-subtotal="${sec.id}">¥0 / ${fmtCNY(budgetCNY)}</span>
      </div>
      <div class="section-actions">
        <button type="button" data-fill-section="${sec.id}">按预算填本组</button>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function populateMonthPicker() {
  const sel = document.getElementById('monthPicker');
  const months = buildMonthOptions();
  sel.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
}

// ============================================
// 月份加载与计算
// ============================================

function loadMonth(m) {
  currentMonth = m;
  document.getElementById('monthPicker').value = m;
  const saved = storageGet('month:' + m);
  monthData = saved || { actuals: {}, notes: '', saved_at: null };
  document.querySelectorAll('input[data-item]').forEach(inp => {
    const id = inp.getAttribute('data-item');
    const v = monthData.actuals ? monthData.actuals[id] : undefined;
    inp.value = (v !== undefined && v !== null && v !== '') ? v : '';
  });
  document.getElementById('monthNotes').value = monthData.notes || '';
  dirty = false;
  updateSaveStatus();
  recalc();
}

function updateSaveStatus() {
  const el = document.getElementById('saveStatus');
  if (dirty) {
    el.textContent = '未保存 •';
    el.classList.add('dirty');
  } else if (monthData.saved_at) {
    const d = new Date(monthData.saved_at);
    const dateStr = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    el.textContent = '已保存 ' + dateStr;
    el.classList.remove('dirty');
  } else {
    el.textContent = '未保存';
    el.classList.remove('dirty');
  }
}

function recalc() {
  let totalBudgetCNY = 0;
  let totalActualCNY = 0;
  let anyFilled = false;
  let savingsActualCNY = 0;

  SECTIONS.forEach(sec => {
    let secBudget = 0;
    let secActual = 0;
    sec.items.forEach(item => {
      const budCNY = toCNY(item.budget, item.cur);
      secBudget += budCNY;
      totalBudgetCNY += budCNY;
      const inp = document.querySelector(`input[data-item="${item.id}"]`);
      const raw = inp && inp.value !== '' ? parseFloat(inp.value) : null;
      let actCNY = 0;
      const varEl = document.querySelector(`[data-var="${item.id}"]`);
      if (raw !== null && !isNaN(raw)) {
        actCNY = toCNY(raw, item.cur);
        secActual += actCNY;
        totalActualCNY += actCNY;
        anyFilled = true;
        const diff = raw - item.budget;
        if (diff === 0) {
          varEl.textContent = '✓';
          varEl.className = 'item-variance v-ok';
        } else if (diff < 0) {
          varEl.textContent = fmtByCur(Math.abs(diff), item.cur) + ' ↓';
          varEl.className = 'item-variance v-ok';
        } else {
          varEl.textContent = '+' + fmtByCur(diff, item.cur);
          varEl.className = 'item-variance v-over';
        }
      } else {
        varEl.textContent = '—';
        varEl.className = 'item-variance';
      }
      if (sec.id === 'savings' && raw !== null && !isNaN(raw)) {
        savingsActualCNY += actCNY;
      }
    });
    const subEl = document.querySelector(`[data-subtotal="${sec.id}"]`);
    if (subEl) subEl.textContent = fmtCNY(secActual) + ' / ' + fmtCNY(secBudget);
  });

  document.getElementById('sumBudget').textContent = fmtCNY(INCOME_CNY);
  if (anyFilled) {
    document.getElementById('sumActual').textContent = fmtCNY(totalActualCNY);
    const diff = totalBudgetCNY - totalActualCNY;
    const sub = document.getElementById('sumActualSub');
    if (diff >= 0) {
      sub.textContent = '预算内 ' + fmtCNY(Math.abs(diff));
      sub.style.color = 'var(--success)';
    } else {
      sub.textContent = '超支 ' + fmtCNY(Math.abs(diff));
      sub.style.color = 'var(--danger)';
    }
    if (savingsActualCNY > 0) {
      const rate = (savingsActualCNY / INCOME_CNY) * 100;
      document.getElementById('sumRate').textContent = rate.toFixed(1) + '%';
    } else {
      document.getElementById('sumRate').textContent = '—';
    }
  } else {
    document.getElementById('sumActual').textContent = '¥0';
    document.getElementById('sumActualSub').textContent = '待填写';
    document.getElementById('sumActualSub').style.color = 'var(--text-tertiary)';
    document.getElementById('sumRate').textContent = '—';
  }

  renderPacman(totalActualCNY, totalBudgetCNY, anyFilled);
}

// ============================================
// 吃豆人进度条
// ============================================

// 吃豆人（像素风，嘴巴朝右）
const PAC_GRID = [
  '..oooo..',
  '.oooooo.',
  'ooo.....',
  'oo......',
  'oo......',
  'ooo.....',
  '.oooooo.',
  '..oooo..',
];
// 终点：像素爱心旗
const GOAL_GRID = [
  'yyyyyyyy',  // 旗顶
  'yrryyrry',  // 爱心两个圆顶
  'rhhrrhhr',  // 爱心中间
  'rhhhhhhr',  // 爱心最宽
  'yrhhhhry',  // 收窄
  'yyrhhryy',
  'yyyrryyy',  // 爱心尖
  'yyyyyyyy',  // 旗底
];

function pixelArt(grid, cx, cy, px, palette) {
  const offX = cx - 4 * px;
  const offY = cy - 4 * px;
  let html = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const ch = grid[r][c];
      const fill = palette[ch];
      if (fill) {
        html += `<rect x="${offX + c * px}" y="${offY + r * px}" width="${px}" height="${px}" fill="${fill}"/>`;
      }
    }
  }
  return html;
}

function renderPacman(actualCNY, budgetCNY, anyFilled) {
  const svg = document.getElementById('pacmanSvg');
  const status = document.getElementById('pacmanStatus');
  const foot = document.getElementById('pacmanFoot');
  if (!svg) return;

  const W = 800, H = 56, midY = H / 2;
  const px = 4;
  const pacHalf = 4 * px;
  const xStart = 8 + pacHalf;
  const xApple = W - 8 - pacHalf;

  const ratio = budgetCNY > 0 ? actualCNY / budgetCNY : 0;
  let xPac;
  if (ratio <= 1) {
    xPac = xStart + Math.max(ratio, 0) * (xApple - xStart);
  } else {
    // 超支时让吃豆人略过苹果，最多伸出 24px
    xPac = xApple + Math.min((ratio - 1) * 200, 24);
  }

  // 豆子均匀分布在轨道上
  const dotCount = 22;
  const dotStart = xStart + pacHalf + 6;
  const dotEnd = xApple - pacHalf - 6;
  const dotStep = (dotEnd - dotStart) / (dotCount - 1);

  let html = '';
  // 轨道暗色衬底（一条 thin line）
  html += `<line x1="${xStart}" y1="${midY}" x2="${xApple}" y2="${midY}" stroke="var(--border-soft, rgba(15,14,11,0.18))" stroke-width="1" stroke-dasharray="2 4"/>`;

  // 未吃掉的豆子
  for (let i = 0; i < dotCount; i++) {
    const dx = dotStart + i * dotStep;
    if (dx > xPac + pacHalf - 2) {
      html += `<rect x="${dx - 2}" y="${midY - 2}" width="4" height="4" fill="var(--text-secondary)" shape-rendering="crispEdges"/>`;
    }
  }

  // 终点（用图片，超预算时淡化）
  const goalSize = 32;
  const goalOpacity = ratio > 1 ? 0.3 : 1;
  html += `<image href="assets/flag.png" x="${xApple - goalSize / 2}" y="${midY - goalSize / 2}" width="${goalSize}" height="${goalSize}" opacity="${goalOpacity}" style="image-rendering:pixelated"/>`;

  // 吃豆人（用图片）
  const pacSize = 32;
  const filter = ratio > 1 ? 'filter="hue-rotate(-30deg) saturate(1.3)"' : '';
  html += `<image href="assets/douzi.png" x="${xPac - pacSize / 2}" y="${midY - pacSize / 2}" width="${pacSize}" height="${pacSize}" style="image-rendering:pixelated" ${filter}/>`;

  svg.innerHTML = html;

  // 状态文字
  if (!anyFilled || budgetCNY <= 0) {
    status.innerHTML = `预算 ${fmtCNY(budgetCNY)} · 待填写`;
    foot.textContent = '吃完小豆豆抵达爱心 — 但别吃过头';
    return;
  }
  const pct = Math.round(ratio * 100);
  const remain = budgetCNY - actualCNY;
  if (ratio <= 1) {
    status.innerHTML = `已花 ${fmtCNY(actualCNY)} / 预算 ${fmtCNY(budgetCNY)} <span class="pacman-pct">${pct}%</span>`;
    foot.textContent = remain > 0
      ? `还剩 ${fmtCNY(remain)} 才到终点`
      : '正好抵达终点，干得漂亮';
  } else {
    status.innerHTML = `已花 ${fmtCNY(actualCNY)} / 预算 ${fmtCNY(budgetCNY)} <span class="pacman-pct over">${pct}%</span>`;
    foot.textContent = `超出预算 ${fmtCNY(-remain)} — 吃过头啦`;
  }
}

// ============================================
// 保存与历史
// ============================================

function saveMonth() {
  const actuals = {};
  document.querySelectorAll('input[data-item]').forEach(inp => {
    const id = inp.getAttribute('data-item');
    const v = inp.value;
    if (v !== '') {
      const n = parseFloat(v);
      if (!isNaN(n)) actuals[id] = n;
    }
  });
  const notes = document.getElementById('monthNotes').value;
  const saved_at = new Date().toISOString();
  const payload = { actuals, notes, saved_at };
  const ok = storageSet('month:' + currentMonth, payload);
  if (ok) {
    addMonthTracked(currentMonth);
    monthData = payload;
    dirty = false;
    updateSaveStatus();
    showToast('已保存 ' + currentMonth);
    renderHistory();
  } else {
    showToast('保存失败，请检查浏览器存储权限', true);
  }
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => { t.classList.remove('show'); }, 2400);
}

function renderHistory() {
  const list = document.getElementById('histList');
  const months = getMonthsTracked();
  if (!months.length) {
    list.innerHTML = '<div class="empty">还没有保存过的月份，填完本月后点「保存本月」就会显示在这里。</div>';
    return;
  }
  const totalBudgetCNY = SECTIONS.reduce((s, sec) =>
    s + sec.items.reduce((ss, i) => ss + toCNY(i.budget, i.cur), 0), 0);
  const rows = [];
  months.slice().reverse().forEach(m => {
    const data = storageGet('month:' + m);
    let totalCNY = 0;
    let savingsCNY = 0;
    if (data && data.actuals) {
      SECTIONS.forEach(sec => {
        sec.items.forEach(item => {
          const v = data.actuals[item.id];
          if (v !== undefined && v !== null) {
            const c = toCNY(v, item.cur);
            totalCNY += c;
            if (sec.id === 'savings') savingsCNY += c;
          }
        });
      });
    }
    const diff = totalBudgetCNY - totalCNY;
    const diffLabel = totalCNY === 0 ? '—' : (diff >= 0 ? '预算内' : '超支');
    const diffClass = totalCNY === 0 ? '' : (diff >= 0 ? 'v-ok' : 'v-over');
    const rate = savingsCNY > 0 ? ((savingsCNY / INCOME_CNY) * 100).toFixed(0) + '%' : '—';
    rows.push(`<div class="history-row">
      <span style="font-weight: 500;">${m}</span>
      <span style="color: var(--text-secondary);">${totalCNY > 0 ? fmtCNY(totalCNY) : '空'}</span>
      <span class="${diffClass}">${diffLabel}</span>
      <span style="color: var(--text-secondary);">储蓄 ${rate}</span>
      <button class="history-load" type="button" data-load="${m}">查看</button>
    </div>`);
  });
  list.innerHTML = rows.join('');
  list.querySelectorAll('[data-load]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      loadMonth(e.target.getAttribute('data-load'));
    });
  });
}

// ============================================
// 导入导出
// ============================================

function exportData() {
  const months = getMonthsTracked();
  const data = {
    exported_at: new Date().toISOString(),
    version: 1,
    months: {}
  };
  months.forEach(m => {
    const d = storageGet('month:' + m);
    if (d) data.months[m] = d;
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `budget-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出备份文件');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.months) throw new Error('格式不对');
      let count = 0;
      Object.keys(data.months).forEach(m => {
        storageSet('month:' + m, data.months[m]);
        addMonthTracked(m);
        count++;
      });
      loadMonth(currentMonth);
      renderHistory();
      showToast(`已导入 ${count} 个月的数据`);
    } catch (err) {
      showToast('导入失败：文件格式不对', true);
    }
  };
  reader.readAsText(file);
}

// ============================================
// 事件绑定
// ============================================

function bindEvents() {
  document.getElementById('sectionsWrap').addEventListener('input', (e) => {
    if (e.target.matches('input[data-item]')) {
      dirty = true;
      updateSaveStatus();
      recalc();
    }
  });

  document.getElementById('sectionsWrap').addEventListener('click', (e) => {
    const fill = e.target.getAttribute('data-fill-section');
    if (fill) {
      const sec = SECTIONS.find(s => s.id === fill);
      sec.items.forEach(item => {
        const inp = document.querySelector(`input[data-item="${item.id}"]`);
        if (inp) inp.value = item.budget;
      });
      dirty = true;
      updateSaveStatus();
      recalc();
    }
  });

  document.getElementById('monthPicker').addEventListener('change', (e) => {
    loadMonth(e.target.value);
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    const sel = document.getElementById('monthPicker');
    if (sel.selectedIndex > 0) {
      sel.selectedIndex -= 1;
      loadMonth(sel.value);
    }
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    const sel = document.getElementById('monthPicker');
    if (sel.selectedIndex < sel.options.length - 1) {
      sel.selectedIndex += 1;
      loadMonth(sel.value);
    }
  });

  document.getElementById('saveBtn').addEventListener('click', saveMonth);

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('确定清空本月所有输入？')) return;
    document.querySelectorAll('input[data-item]').forEach(inp => inp.value = '');
    document.getElementById('monthNotes').value = '';
    dirty = true;
    updateSaveStatus();
    recalc();
  });

  document.getElementById('fillBudgetBtn').addEventListener('click', () => {
    SECTIONS.forEach(sec => {
      sec.items.forEach(item => {
        const inp = document.querySelector(`input[data-item="${item.id}"]`);
        if (inp && inp.value === '') inp.value = item.budget;
      });
    });
    dirty = true;
    updateSaveStatus();
    recalc();
  });

  document.getElementById('monthNotes').addEventListener('input', () => {
    dirty = true;
    updateSaveStatus();
  });

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    if (e.target.files.length) importData(e.target.files[0]);
    e.target.value = '';
  });

  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      saveMonth();
    }
  });
}

// ============================================
// 初始化
// ============================================

function setupBookName() {
  const el = document.getElementById('bookName');
  if (!el) return;
  el.value = storageGet('book_name') || '我的账本';
  el.addEventListener('blur', () => {
    const v = el.value.trim();
    storageSet('book_name', v);
    if (!v) el.value = '我的账本';
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') {
      el.value = storageGet('book_name') || '我的账本';
      el.blur();
    }
  });
}

function init() {
  setupBookName();
  renderSections();
  populateMonthPicker();
  bindEvents();
  let defaultMonth = `${CONFIG.monthRange.start.year}-${String(CONFIG.monthRange.start.month).padStart(2, '0')}`;
  const tracked = getMonthsTracked();
  if (tracked.length) defaultMonth = tracked[tracked.length - 1];
  loadMonth(defaultMonth);
  renderHistory();
}

init();

</script>

// 历史看板 - 基于鲨鱼记账明细的可视化
// 数据来源: src/data/records.json (从 CSV 转换)
(function () {
const fmtCNY = (n) => '¥' + Math.round(n).toLocaleString('en-US');

// 类别配色（pastel tag），按类别名稳定哈希
const TAG_CLASSES = ['tag-mint','tag-pink','tag-blue','tag-purple','tag-rose','tag-yellow','tag-orange','tag-gray'];
function tagFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0x7fffffff;
  return TAG_CLASSES[h % TAG_CLASSES.length];
}

// 当前选中的月份；空字符串 = 全年总览
let selectedMonth = '';
const fmtCNYShort = (n) => {
  const v = Math.round(n);
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  if (abs >= 10000) return sign + '¥' + (abs / 10000).toFixed(1) + 'w';
  return sign + '¥' + abs.toLocaleString('en-US');
};

// ============================================
// 数据聚合
// ============================================

function aggregate(records) {
  const byMonth = {};      // ym -> { exp, inc, byCat: {cat: amt} }
  const byCat = {};        // cat -> total
  const months = new Set();
  const cats = new Set();

  for (const r of records) {
    const ym = r.d.slice(0, 7);
    months.add(ym);
    if (!byMonth[ym]) byMonth[ym] = { exp: 0, inc: 0, byCat: {} };
    if (r.t === '支出') {
      byMonth[ym].exp += r.a;
      byMonth[ym].byCat[r.c] = (byMonth[ym].byCat[r.c] || 0) + r.a;
      byCat[r.c] = (byCat[r.c] || 0) + r.a;
      cats.add(r.c);
    } else {
      byMonth[ym].inc += r.a;
    }
  }

  return {
    months: [...months].sort(),
    cats: [...cats].sort((a, b) => byCat[b] - byCat[a]),
    byMonth,
    byCat
  };
}

// ============================================
// 摘要指标
// ============================================

function renderSummary(agg) {
  const ms = agg.months;
  const labels = {
    full: ['总支出', '月均支出', '月均收入', '月均盈余'],
    one:  ['当月支出', '对比月均', '当月收入', '当月盈余'],
  };

  const totalExp12 = ms.reduce((s, m) => s + agg.byMonth[m].exp, 0);
  const totalInc12 = ms.reduce((s, m) => s + agg.byMonth[m].inc, 0);
  const n = ms.length;
  const avgExp = totalExp12 / n;
  const avgInc = totalInc12 / n;

    document.getElementById('mLabel' + i).textContent = t;
  });

    setLabels(labels.full);
    const avgNet = avgInc - avgExp;
    const rate = avgInc > 0 ? avgNet / avgInc : 0;

    let maxM = ms[0], minM = ms[0];
    for (const m of ms) {
      if (agg.byMonth[m].exp > agg.byMonth[maxM].exp) maxM = m;
      if (agg.byMonth[m].exp < agg.byMonth[minM].exp) minM = m;
    }

    document.getElementById('mTotalExp').textContent = fmtCNY(totalExp12);
    document.getElementById('mMonths').textContent = `${n} 个月累计`;

    document.getElementById('mAvgExpSub').textContent =
      `最高 ${maxM.slice(5)}月 ${fmtCNY(agg.byMonth[maxM].exp)} · 最低 ${minM.slice(5)}月 ${fmtCNY(agg.byMonth[minM].exp)}`;
    document.getElementById('mAvgInc').textContent = fmtCNY(avgInc);
    document.getElementById('mAvgIncSub').textContent = '含意外收入';

    const netEl = document.getElementById('mAvgNet');
    netEl.classList.remove('metric-pos', 'metric-neg');
    netEl.textContent = (avgNet >= 0 ? '' : '-') + fmtCNY(Math.abs(avgNet));
    netEl.classList.add(avgNet >= 0 ? 'metric-pos' : 'metric-neg');
    document.getElementById('mAvgNetSub').textContent = `储蓄率 ${(rate * 100).toFixed(1)}%`;
  } else {
    // 单月详情
    setLabels(labels.one);
    const m = agg.byMonth[selectedMonth] || { exp: 0, inc: 0, byCat: {} };
    const exp = m.exp, inc = m.inc, net = inc - exp;
    const rate = inc > 0 ? net / inc : 0;
    const expDiff = exp - avgExp;
    const incDiff = inc - avgInc;

    document.getElementById('mTotalExp').textContent = fmtCNY(exp);
    document.getElementById('mMonths').textContent =
      (expDiff >= 0 ? '高于月均 ' : '低于月均 ') + fmtCNY(Math.abs(expDiff));

    document.getElementById('mAvgExp').textContent = fmtCNY(avgExp);
    document.getElementById('mAvgExpSub').textContent = `12 个月平均水平`;

    document.getElementById('mAvgInc').textContent = fmtCNY(inc);
    document.getElementById('mAvgIncSub').textContent =
      (incDiff >= 0 ? '高于月均 ' : '低于月均 ') + fmtCNY(Math.abs(incDiff));

    const netEl = document.getElementById('mAvgNet');
    netEl.classList.remove('metric-pos', 'metric-neg');
    netEl.textContent = (net >= 0 ? '' : '-') + fmtCNY(Math.abs(net));
    netEl.classList.add(net >= 0 ? 'metric-pos' : 'metric-neg');
    document.getElementById('mAvgNetSub').textContent = `储蓄率 ${(rate * 100).toFixed(1)}%`;
  }

  document.getElementById('dateRange').textContent =
    selectedMonth
      ? `查看月份 · ${selectedMonth}`
      : `${ms[0]} → ${ms[ms.length - 1]}`;
}

// ============================================
// 月度柱状图（SVG）
// ============================================

function renderBars(agg) {
  const svg = document.getElementById('barsSvg');
  const ms = agg.months;
  const W = Math.max(720, svg.clientWidth || 720);
  const H = 260;
  const padL = 50, padR = 10, padT = 16, padB = 36;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const maxV = Math.max(
    ...ms.map(m => Math.max(agg.byMonth[m].exp, agg.byMonth[m].inc))
  );
  // 上取整到最近的 5000
  const step = 5000;
  const yMax = Math.ceil(maxV / step) * step;

  const groupW = innerW / ms.length;
  const barW = Math.min(18, (groupW - 6) / 2);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');

  let html = '';

  // y 轴网格 + 标签
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (yMax / ticks) * i;
    const y = padT + innerH - (v / yMax) * innerH;
    html += `<line class="bar-grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    html += `<text class="bar-label" x="${padL - 6}" y="${y + 3}" text-anchor="end">${fmtCNYShort(v)}</text>`;
  }

  // 每个月一组
  ms.forEach((m, i) => {
    const cx = padL + i * groupW + groupW / 2;
    const exp = agg.byMonth[m].exp;
    const inc = agg.byMonth[m].inc;
    const expH = (exp / yMax) * innerH;
    const incH = (inc / yMax) * innerH;
    const baseY = padT + innerH;

    const x1 = cx - barW - 1;
    const x2 = cx + 1;

    const sel = m === selectedMonth;
    const opacity = (selectedMonth && !sel) ? 0.35 : 1;
    html += `<rect class="bar-expense" x="${x1}" y="${baseY - expH}" width="${barW}" height="${expH}" rx="2" opacity="${opacity}"/>`;
    html += `<rect class="bar-income"  x="${x2}" y="${baseY - incH}" width="${barW}" height="${incH}" rx="2" opacity="${opacity}"/>`;
    if (sel) {
      // 高亮选中月：底部加一条粗线
      html += `<rect x="${cx - groupW/2 + 2}" y="${baseY + 2}" width="${groupW - 4}" height="2" fill="var(--text-primary)" rx="1"/>`;
    }

    // 月份标签
    html += `<text class="bar-month" x="${cx}" y="${H - 14}" text-anchor="middle">${m.slice(5)}月</text>`;
    // 净值标签
    const net = inc - exp;
    const netCol = net >= 0 ? 'var(--success)' : 'var(--danger)';
    html += `<text class="bar-value" x="${cx}" y="${H - 2}" text-anchor="middle" style="fill:${netCol}">${net >= 0 ? '+' : ''}${fmtCNYShort(net)}</text>`;
  });

  // 基线
  html += `<line class="bar-axis" x1="${padL}" y1="${padT + innerH}" x2="${W - padR}" y2="${padT + innerH}"/>`;

  svg.innerHTML = html;
  document.getElementById('barsHint').textContent = '· 月份下方为当月盈余';
}

// ============================================
// 类别分布
// ============================================

function renderCategories(agg) {
  const wrap = document.getElementById('catList');
  const n = agg.months.length;

  // 单月模式：用当月类别；全年模式：用累计
  const data = selectedMonth
    ? Object.entries(agg.byMonth[selectedMonth]?.byCat || {})
    : Object.entries(agg.byCat);

  data.sort((a, b) => b[1] - a[1]);
  if (data.length === 0) {
    wrap.innerHTML = '<div class="empty">该月暂无支出记录</div>';
    return;
  }

  const total = data.reduce((s, [, v]) => s + v, 0);
  const max = data[0][1];

  wrap.innerHTML = data.map(([c, v]) => {
    const pct = (v / total) * 100;
    const barW = (v / max) * 100;
    const tag = tagFor(c);
    const sub = selectedMonth
      ? ''
      : `<span class="muted">/ 月均 ${fmtCNY(v / n)}</span>`;
    return `
      <div class="cat-row">
        <span class="cat-name"><span class="tag ${tag}">${c}</span></span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${barW}%"></div></div>
        <span class="cat-amt">${fmtCNY(v)} ${sub}</span>
        <span class="cat-pct">${pct.toFixed(1)}%</span>
      </div>
    `;
  }).join('');
}

// ============================================
// 月份 × 类别 热力表
// ============================================

function renderHeatmap(agg) {
  const table = document.getElementById('heatTable');
  const topCats = agg.cats.slice(0, 12); // Top 12 类别
  const ms = agg.months;

  // 找出每个类别在所有月里的最大值，用于热力分级
  const catMax = {};
  topCats.forEach(c => {
    catMax[c] = Math.max(...ms.map(m => agg.byMonth[m].byCat[c] || 0));
  });

  const heatLevel = (v, max) => {
    if (!v) return 0;
    const r = v / max;
    if (r < 0.2) return 1;
    if (r < 0.4) return 2;
    if (r < 0.6) return 3;
    if (r < 0.8) return 4;
    return 5;
  };

  let html = '<thead><tr><th>类别</th>';
  ms.forEach(m => { html += `<th>${m.slice(5)}月</th>`; });
  html += '<th>合计</th></tr></thead><tbody>';

  topCats.forEach(c => {
    html += `<tr><td>${c}</td>`;
    let rowTotal = 0;
    ms.forEach(m => {
      const v = agg.byMonth[m].byCat[c] || 0;
      rowTotal += v;
      const lvl = heatLevel(v, catMax[c]);
      const cls = v ? `heat-cell h-${lvl}` : 'heat-cell-empty';
      html += `<td class="${cls}" data-cat="${c}" data-month="${m}" data-amt="${Math.round(v)}">${v ? Math.round(v).toLocaleString('en-US') : '·'}</td>`;
    });
    html += `<td>${Math.round(rowTotal).toLocaleString('en-US')}</td></tr>`;
  });

  // 每月总计行
  html += '<tr class="heat-row-total"><td>月支出</td>';
  let grand = 0;
  ms.forEach(m => {
    const v = agg.byMonth[m].exp;
    grand += v;
    html += `<td>${Math.round(v).toLocaleString('en-US')}</td>`;
  });
  html += `<td>${Math.round(grand).toLocaleString('en-US')}</td></tr>`;
  html += '</tbody>';

  table.innerHTML = html;
}

// ============================================
// 开销画像（每类别月均 + sparkline）
// ============================================

function renderProfile(agg) {
  const wrap = document.getElementById('profileGrid');
  const ms = agg.months;
  const n = ms.length;

  wrap.innerHTML = agg.cats.map(c => {
    const series = ms.map(m => agg.byMonth[m].byCat[c] || 0);
    const total = series.reduce((s, v) => s + v, 0);
    const avg = total / n;
    const max = Math.max(...series, 1);

    const w = 140, h = 22;
    const stepX = w / (series.length - 1 || 1);
    const points = series.map((v, i) => {
      const x = i * stepX;
      const y = h - (v / max) * (h - 2) - 1;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const linePath = 'M ' + points.join(' L ');
    const areaPath = `M 0,${h} L ${points.join(' L ')} L ${w},${h} Z`;

    return `
      <div class="profile-row">
        <span class="profile-name">${c}</span>
        <svg class="profile-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <path class="area" d="${areaPath}"/>
          <path d="${linePath}"/>
        </svg>
        <span class="profile-avg">${fmtCNY(avg)}/月</span>
      </div>
    `;
  }).join('');
}

// ============================================
// 大额记录 Top 20
// ============================================

let allRecords = [];

let currentFilterCat = '';

function renderBigList() {
  const wrap = document.getElementById('bigList');
  const expenses = allRecords.filter(r =>
    r.t === '支出'
    && (!currentFilterCat || r.c === currentFilterCat)
    && (!selectedMonth || r.d.slice(0, 7) === selectedMonth)
  );
  const top = expenses.slice().sort((a, b) => b.a - a.a).slice(0, 20);

  if (top.length === 0) {
    wrap.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  wrap.innerHTML = top.map(r => `
    <div class="big-row">
      <span class="big-date">${r.d}</span>
      <span class="tag ${tagFor(r.c)}">${r.c}</span>
      <span class="big-note">${r.n || '—'}</span>
      <span class="big-amt">${fmtCNY(r.a)}</span>
    </div>
  `).join('');
}

function setupHeatTooltip() {
  let tip = document.querySelector('.heat-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'heat-tooltip';
    document.body.appendChild(tip);
  }
  const table = document.getElementById('heatTable');

  table.addEventListener('mousemove', (e) => {
    const cell = e.target.closest('td.heat-cell, td.heat-cell-empty');
    if (!cell || !cell.dataset.cat) {
      tip.classList.remove('show');
      return;
    }
    const cat = cell.dataset.cat;
    const month = cell.dataset.month;
    const amt = parseInt(cell.dataset.amt, 10);
    const amtStr = amt > 0 ? '¥' + amt.toLocaleString('en-US') : '无支出';
    tip.innerHTML = `<strong>${cat}</strong> · ${month}<br><span class="t-amt">${amtStr}</span>`;
    const r = cell.getBoundingClientRect();
    tip.style.left = (r.left + r.width / 2) + 'px';
    tip.style.top = r.top + 'px';
    tip.classList.add('show');
  });

  table.addEventListener('mouseleave', () => tip.classList.remove('show'));
}

function setupBigFilter(agg) {
  const sel = document.getElementById('bigCatFilter');
  agg.cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => {
    currentFilterCat = e.target.value;
    renderBigList();
  });
}

// ============================================
// 月份切换
// ============================================

function renderMonthTabs(agg, onChange) {
  const wrap = document.getElementById('dashMonthTabs');
  const months = agg.months.slice().reverse(); // 最新月在前
  const items = [{ value: '', label: '全年总览' }, ...months.map(m => ({ value: m, label: m.slice(2).replace('-', '·') }))];
  wrap.innerHTML = items.map(it =>
    `<button class="month-tab${it.value === selectedMonth ? ' active' : ''}" data-month="${it.value}" type="button">${it.label}</button>`
  ).join('');
  wrap.querySelectorAll('.month-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMonth = btn.dataset.month;
      wrap.querySelectorAll('.month-tab').forEach(b => b.classList.toggle('active', b === btn));
      onChange();
    });
  });
}

// ============================================
// 入口
// ============================================

async function init() {
  try {
    let records;
    if (window.__RECORDS__) {
      // 单文件版：数据已被 build.sh 内联
      records = window.__RECORDS__;
    } else {
      // 开发版：通过 HTTP 加载
      const res = await fetch('data/records.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      records = await res.json();
    }
    allRecords = records;
    const agg = aggregate(records);

    function refresh() {
      renderSummary(agg);
      renderBars(agg);
      renderCategories(agg);
      renderBigList();
    }

    renderMonthTabs(agg, refresh);
    refresh();
    renderHeatmap(agg);
    setupHeatTooltip();
    renderProfile(agg);
    setupBigFilter(agg);

    // 切换到看板 tab 时重绘柱状图（首次显示后才有正确的宽度）
    window.__redrawDashboard = () => renderBars(agg);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderBars(agg), 150);
    });
  } catch (e) {
    const host = document.getElementById('view-dashboard') || document.querySelector('.app');
    host.insertAdjacentHTML(
      'beforeend',
      `<div class="card" style="color:var(--danger)">数据加载失败：${e.message}<br/>请通过 HTTP 访问（如 <code>python3 -m http.server 8080</code>），不要直接双击打开。</div>`
    );
    console.error(e);
  }
}

init();
})();

</script>
